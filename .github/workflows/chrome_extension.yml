name: Chrome extension

on:
  push:
    branches: ["chrome-extension"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome-extension:
    name: Build Shah Re-Writer Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - name: Enable Corepack
        run: corepack enable
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: build-chrome-extension
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # main
      - name: Install `wasm-pack`
        run: cargo binstall wasm-pack --force --no-confirm
      - name: Build extension
        run: just build-chrome-plugin
      - name: Stage unpacked extension
        run: |
          mkdir -p dist-ext
          cp -r packages/chrome-plugin/build dist-ext/shah-rewriter-chrome-extension
          grep -q '"name": "Shah Re-Writer"' dist-ext/shah-rewriter-chrome-extension/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: shah-rewriter-chrome-extension
          path: dist-ext/
          if-no-files-found: error
