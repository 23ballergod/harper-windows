name: AI checker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: harper-ai
      - name: Unit tests
        run: cargo test -p harper-ai --release

  benchmark:
    name: Grammar benchmark (${{ matrix.model }} model)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: Fast
            weights: Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
            file: qwen2.5-0.5b-instruct-q4_k_m.gguf
          - model: Accurate
            weights: Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
            file: qwen2.5-1.5b-instruct-q4_k_m.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: harper-ai
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ matrix.file }}-v1
      - name: Download model
        run: |
          mkdir -p models
          [ -f models/${{ matrix.file }} ] || curl -fsSL -o models/${{ matrix.file }} https://huggingface.co/${{ matrix.weights }}
          [ -f models/qwen2.5-tokenizer.json ] || curl -fsSL -o models/qwen2.5-tokenizer.json https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/main/tokenizer.json
          ls -la models
      - name: Model smoke test
        run: cargo run -p harper-ai --release --example correct -- models ${{ matrix.model }}
      - name: Benchmark on the tricky set
        run: |
          cargo run -p harper-ai --release --example benchmark -- models ${{ matrix.model }} 2>/dev/null | tee benchmark-${{ matrix.model }}.md
          cat benchmark-${{ matrix.model }}.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.model }}
          path: benchmark-${{ matrix.model }}.md
