name: AI checker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test harper-ai with the real model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: harper-ai
      - name: Unit tests
        run: cargo test -p harper-ai --release
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models
          key: qwen2.5-0.5b-q4km-v1
      - name: Download model
        run: |
          mkdir -p models
          [ -f models/qwen2.5-0.5b-instruct-q4_k_m.gguf ] || curl -fsSL -o models/qwen2.5-0.5b-instruct-q4_k_m.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          [ -f models/qwen2.5-tokenizer.json ] || curl -fsSL -o models/qwen2.5-tokenizer.json https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/main/tokenizer.json
          ls -la models
      - name: Model smoke test
        run: cargo run -p harper-ai --release --example correct -- models Fast
